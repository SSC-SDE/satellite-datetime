# Main-only CI/CD: dev → qa → pre-prod on every push/PR; prod on version tags.
#
# Configure GitHub Environments (Settings → Environments) for optional gates:
#   dev       — fast feedback (no protection)
#   qa        — quality gate
#   pre-prod  — release readiness on main (optional reviewers)
#   prod      — crates.io publish on v* tags (required reviewers + CARGO_REGISTRY_TOKEN)

name: pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # dev — fast feedback (< ~2 min): format + core tests
  # ---------------------------------------------------------------------------
  dev:
    name: dev / fast feedback
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo test (all features)
        run: cargo test --all-features
      - name: cargo test (no_std core)
        run: cargo test --no-default-features --lib

  # ---------------------------------------------------------------------------
  # qa — quality gate: lint, package, MSRV, embedded profile
  # ---------------------------------------------------------------------------
  qa:
    name: qa / lint and package
    needs: dev
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: cargo clippy
        run: cargo clippy --all-features -- -D warnings
      - name: cargo example rfc3339_leap
        run: cargo run --example rfc3339_leap --features earth
      - name: cargo package
        run: cargo package --locked

  qa-msrv:
    name: qa / MSRV 1.85
    needs: dev
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: cargo check (all features)
        run: cargo check --all-features

  qa-embedded:
    name: qa / no_std thumbv7em-none-eabihf
    needs: dev
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - name: cargo check (Cortex-M4F satellite profile)
        run: cargo check --no-default-features --target thumbv7em-none-eabihf

  # ---------------------------------------------------------------------------
  # pre-prod — release readiness (main pushes only, after qa passes)
  # ---------------------------------------------------------------------------
  pre-prod:
    name: pre-prod / release readiness
    needs: [qa, qa-msrv, qa-embedded]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: pre-prod
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify Cargo.lock is committed
        run: |
          cargo generate-lockfile
          git diff --exit-code Cargo.lock
      - name: cargo doc (all features)
        run: cargo doc --no-deps --all-features
      - name: cargo publish (dry run)
        run: cargo publish --locked --dry-run
      - name: pre-prod summary
        run: |
          echo "pre-prod passed for $(grep '^version' Cargo.toml | head -1)"
          echo "Tag v* on main to trigger prod publish (requires CARGO_REGISTRY_TOKEN)."

  # ---------------------------------------------------------------------------
  # prod — crates.io publish (version tags only)
  # ---------------------------------------------------------------------------
  prod:
    name: prod / crates.io publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo publish
        run: cargo publish --locked --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
